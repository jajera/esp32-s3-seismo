[project]
site_name = "ESP32-S3 seismo"
site_description = "ESP32-S3 N16R8 + LSM6DSO + ST7789 local seismometer walkthrough"
site_url = "https://esp32-s3-seismo.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "Prerequisites" = "prerequisites.md" },
  { "Hardware" = "hardware.md" },
  { "Firmware" = "firmware.md" },
  { "Phase 0 — USB erase" = "phases/00-usb-erase.md" },
  { "Phase 1 — Hello flash" = "phases/01-hello-flash.md" },
  { "Phase 2 — TFT power" = "phases/02-tft-power.md" },
  { "Phase 3 — IMU power" = "phases/03-imu-power.md" },
  { "Phase 4 — I2C scan" = "phases/04-i2c-scan.md" },
  { "Phase 5 — Accel stream" = "phases/05-accel-stream.md" },
  { "Phase 6 — TFT fill" = "phases/06-tft-fill.md" },
  { "Phase 7 — Intensity UI" = "phases/07-intensity-ui.md" },
  { "Lab log" = "lab-log.md" },
]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed" = { alternate_style = true }
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
