<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560"
     width="1180" height="560" role="img"
     aria-label="Block diagram: ESP32-S3 linked to an LSM6DSO IMU over I2C and an ST7789 display over SPI">
  <rect width="1180" height="560" fill="#f5f5f2"/>

  <text x="48" y="58" font-family="DejaVu Sans, sans-serif" font-size="34"
        font-weight="700" fill="#1c1e20">How the station fits together</text>
  <text x="50" y="92" font-family="DejaVu Sans, sans-serif" font-size="17"
        fill="#6e7376">Three devices on one 3V3 star — pin-level detail lives on the Hardware page.</text>

  <!-- buses (drawn under the cards) -->
  <line x1="470" y1="250" x2="760" y2="200" stroke="#268080" stroke-width="6"/>
  <circle cx="470" cy="250" r="6" fill="#268080"/>
  <circle cx="760" cy="200" r="6" fill="#268080"/>
  <line x1="470" y1="330" x2="760" y2="410" stroke="#ba5c34" stroke-width="6"/>
  <circle cx="470" cy="330" r="6" fill="#ba5c34"/>
  <circle cx="760" cy="410" r="6" fill="#ba5c34"/>

  
  <g>
    <rect x="174.0" y="220.0" width="300" height="150" rx="16" fill="#e1e1dd"/>
    <rect x="170.0" y="215.0" width="300" height="150" rx="16" fill="#ffffff"
          stroke="#4a6078" stroke-width="3"/>
    <rect x="170.0" y="215.0" width="300" height="10" rx="5" fill="#4a6078"/>
    <g transform="translate(226.0,298)"><rect x="-34" y="-34" width="68" height="68" rx="8" fill="none" stroke="#4a6078" stroke-width="3.5"/><circle cx="-22" cy="-22" r="4" fill="#4a6078"/><line x1="-43" y1="-21" x2="-34" y2="-21" stroke="#4a6078" stroke-width="3"/><line x1="34" y1="-21" x2="43" y2="-21" stroke="#4a6078" stroke-width="3"/><line x1="-21" y1="-43" x2="-21" y2="-34" stroke="#4a6078" stroke-width="3"/><line x1="-21" y1="34" x2="-21" y2="43" stroke="#4a6078" stroke-width="3"/><line x1="-43" y1="-10" x2="-34" y2="-10" stroke="#4a6078" stroke-width="3"/><line x1="34" y1="-10" x2="43" y2="-10" stroke="#4a6078" stroke-width="3"/><line x1="-10" y1="-43" x2="-10" y2="-34" stroke="#4a6078" stroke-width="3"/><line x1="-10" y1="34" x2="-10" y2="43" stroke="#4a6078" stroke-width="3"/><line x1="-43" y1="1" x2="-34" y2="1" stroke="#4a6078" stroke-width="3"/><line x1="34" y1="1" x2="43" y2="1" stroke="#4a6078" stroke-width="3"/><line x1="1" y1="-43" x2="1" y2="-34" stroke="#4a6078" stroke-width="3"/><line x1="1" y1="34" x2="1" y2="43" stroke="#4a6078" stroke-width="3"/><line x1="-43" y1="12" x2="-34" y2="12" stroke="#4a6078" stroke-width="3"/><line x1="34" y1="12" x2="43" y2="12" stroke="#4a6078" stroke-width="3"/><line x1="12" y1="-43" x2="12" y2="-34" stroke="#4a6078" stroke-width="3"/><line x1="12" y1="34" x2="12" y2="43" stroke="#4a6078" stroke-width="3"/><line x1="-43" y1="23" x2="-34" y2="23" stroke="#4a6078" stroke-width="3"/><line x1="34" y1="23" x2="43" y2="23" stroke="#4a6078" stroke-width="3"/><line x1="23" y1="-43" x2="23" y2="-34" stroke="#4a6078" stroke-width="3"/><line x1="23" y1="34" x2="23" y2="43" stroke="#4a6078" stroke-width="3"/></g>
    <text x="282.0" y="280" font-family="DejaVu Sans, sans-serif"
          font-size="27" font-weight="700" fill="#1c1e20">ESP32-S3</text>
    <text x="282.0" y="306" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">N16R8 · 16MB / 8MB</text>
    <text x="282.0" y="328" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">the brain + USB serial</text>
  </g>
  
  <g>
    <rect x="764.0" y="130.0" width="300" height="150" rx="16" fill="#e1e1dd"/>
    <rect x="760.0" y="125.0" width="300" height="150" rx="16" fill="#ffffff"
          stroke="#268080" stroke-width="3"/>
    <rect x="760.0" y="125.0" width="300" height="10" rx="5" fill="#268080"/>
    <g transform="translate(816.0,208)"><rect x="-32.0" y="-24.0" width="64" height="48" rx="6" fill="none" stroke="#268080" stroke-width="3.5"/><rect x="-13" y="-13" width="26" height="26" rx="3" fill="none" stroke="#268080" stroke-width="3"/><path d="M -7 4 A 10 10 0 0 1 7 -4" fill="none" stroke="#268080" stroke-width="2.5"/><circle cx="7" cy="-4" r="2.5" fill="#268080"/></g>
    <text x="872.0" y="190" font-family="DejaVu Sans, sans-serif"
          font-size="27" font-weight="700" fill="#1c1e20">LSM6DSO</text>
    <text x="872.0" y="216" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">6-axis IMU</text>
    <text x="872.0" y="238" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">the motion sensor</text>
  </g>
  
  <g>
    <rect x="764.0" y="340.0" width="300" height="150" rx="16" fill="#e1e1dd"/>
    <rect x="760.0" y="335.0" width="300" height="150" rx="16" fill="#ffffff"
          stroke="#ba5c34" stroke-width="3"/>
    <rect x="760.0" y="335.0" width="300" height="10" rx="5" fill="#ba5c34"/>
    <g transform="translate(816.0,418)"><rect x="-35.0" y="-27.0" width="70" height="54" rx="6" fill="none" stroke="#ba5c34" stroke-width="3.5"/><rect x="-28.0" y="-20.0" width="56" height="40" rx="3" fill="none" stroke="#ba5c34" stroke-width="2"/><path d="M -24.0 0.0 L -14.0 0.0 L -8.0 -12.0 L 0.0 12.0 L 6.0 0.0 L 24.0 0.0" fill="none" stroke="#ba5c34" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text x="872.0" y="400" font-family="DejaVu Sans, sans-serif"
          font-size="27" font-weight="700" fill="#1c1e20">ST7789</text>
    <text x="872.0" y="426" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">2.0″ 240×320</text>
    <text x="872.0" y="448" font-family="DejaVu Sans, sans-serif"
          font-size="16" fill="#6e7376">the readout</text>
  </g>

  <rect x="549.0" y="207" width="132" height="34" rx="9" fill="#f5f5f2"/><text x="615" y="231" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#268080">I2C · 0x6A</text>
  <rect x="587.5" y="352" width="55" height="34" rx="9" fill="#f5f5f2"/><text x="615" y="376" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ba5c34">SPI</text>

  <line x1="48" y1="505" x2="1132" y2="505" stroke="#d7d7d3" stroke-width="2"/>
  <text x="50" y="535" font-family="DejaVu Sans, sans-serif" font-size="17"
        fill="#6e7376">Power: 3V3 only — never 5V on IMU or TFT logic.</text>
</svg>