<text x="162" y="116" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1c1e20">GND</text>
<path d="M 300 220.0 C 470.0 220.0, 470.0 220.0, 640 220.0" fill="none" stroke="#c0392b" stroke-width="4"/>
<circle cx="300" cy="220.0" r="5" fill="#c0392b"/>
<circle cx="640" cy="220.0" r="5" fill="#c0392b"/>
<path d="M 300 220.0 C 470.0 220.0, 470.0 260.0, 640 260.0" fill="none" stroke="#c0392b" stroke-width="4"/>
