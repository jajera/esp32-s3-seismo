<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610" role="img" aria-label="Phase 2 — power the TFT">
<rect width="940" height="610" fill="#f5f5f2"/>
<text x="48" y="52" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#1c1e20">Phase 2 — power the TFT</text>
<text x="50" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7376">Three wires. IMU stays unwired. TFT SPI pins stay open.</text>
<rect x="50" y="108" width="26" height="6" rx="3" fill="#c0392b"/>
<text x="82" y="116" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#1c1e20">3V3</text>
