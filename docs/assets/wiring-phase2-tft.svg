<circle cx="300" cy="260.0" r="5" fill="#2b2d2f"/>
<circle cx="640" cy="300.0" r="5" fill="#2b2d2f"/>
<rect x="74" y="155" width="230" height="130" rx="12" fill="#e1e1dd"/><rect x="70" y="150" width="230" height="130" rx="12" fill="#ffffff" stroke="#4a6078" stroke-width="3"/><rect x="70" y="150" width="230" height="36" rx="12" fill="#4a6078"/><rect x="70" y="170" width="230" height="16" fill="#4a6078"/><text x="185.0" y="175" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ESP32-S3 (N16R8)</text><text x="185.0" y="225.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#1c1e20">3V3</text><text x="185.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#1c1e20">GND</text>
<rect x="644" y="155" width="230" height="370" rx="12" fill="#e1e1dd"/><rect x="640" y="150" width="230" height="370" rx="12" fill="#ffffff" stroke="#e67e22" stroke-width="3"/><rect x="640" y="150" width="230" height="36" rx="12" fill="#e67e22"/><rect x="640" y="170" width="230" height="16" fill="#e67e22"/><text x="755.0" y="175" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ST7789 (TFT)</text><text x="755.0" y="225.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#1c1e20">VDD</text><text x="755.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#1c1e20">BL</text><text x="755.0" y="305.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#1c1e20">GND</text><text x="755.0" y="345.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b9bdbf">SCL</text><text x="755.0" y="385.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b9bdbf">SDA</text><text x="755.0" y="425.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b9bdbf">RES</text><text x="755.0" y="465.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b9bdbf">DC</text><text x="755.0" y="505.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b9bdbf">CS</text>
